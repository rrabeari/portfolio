@let proj = project();

<div class="card h-100 shadow-sm border-0 project-card">
  <!-- Image de couverture / Preview -->
  <div class="card-img-container bg-light position-relative overflow-hidden">
    <img 
      [src]="proj.imageUrl" 
      [alt]="proj.title" 
      class="card-img-top object-fit-cover"
      style="height: 200px;"
      onerror="this.src='https://placehold.co/600x400/212529/fff?text=Project+Preview'"
    />
    <span class="badge bg-primary position-absolute top-0 end-0 m-3 shadow-sm">
      {{ proj.category }}
    </span>
  </div>

  <!-- Corps de la carte -->
  <div class="card-body d-flex flex-column p-4">
    <h3 class="h5 card-title fw-bold text-dark mb-2">{{ proj.title }}</h3>
    <p class="card-text text-secondary small flex-grow-1 mb-3">
      {{ proj.shortDescription }}
    </p>

    <!-- Badges / Tags techniques -->
    <div class="d-flex flex-wrap gap-1 mb-4">
      @for (tag of proj.tags; track tag) {
        <span class="badge bg-light text-dark border me-1 mb-1 fw-normal">
          {{ tag }}
        </span>
      }
    </div>

    <!-- Actions / Boutons -->
    <div class="d-flex align-items-center justify-content-between pt-2 border-top mt-auto">
      <a [routerLink]="['/projects', proj.id]" class="btn btn-primary btn-sm fw-semibold">
        Voir l'étude de cas →
      </a>
      
      @if (proj.githubUrl) {
        <a 
          [href]="proj.githubUrl" 
          target="_blank" 
          rel="noopener noreferrer" 
          class="btn btn-outline-dark btn-sm"
          title="Code source sur GitHub"
        >
          GitHub
        </a>
      }
    </div>
  </div>
</div>
